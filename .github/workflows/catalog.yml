name: Katalog güncelle
# Günde bir kez resmî marketplace.json ile başlangıç paketini doğrular, değiştiyse catalog/remote.json'ı işler.
# Uygulama bu dosyayı config.catalogUrl (raw.githubusercontent.com/<kullanici>/<depo>/main/catalog/remote.json) üzerinden okur.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-catalog.js
      - name: Değiştiyse işle
        run: |
          if ! git diff --quiet -- catalog/remote.json; then
            git config user.name "catalog-bot"
            git config user.email "catalog-bot@users.noreply.github.com"
            git add catalog/remote.json
            git commit -m "catalog: güncellendi"
            git push
          fi
